<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Paneli - Kurum Arşivi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <div id="admin-page">
        <h1><i class="bi bi-shield-lock-fill"></i> Admin Paneli
            <button class="logout-btn" onclick="adminLogout()">
                <i class="bi bi-box-arrow-right"></i> Çıkış
            </button>
        </h1>

        <!-- Kullanıcı Ekle -->
        <div class="admin-card">
            <h2><i class="bi bi-person-plus-fill"></i> Kullanıcı Ekle</h2>
            <div class="input-group">
                <label>Kullanıcı Adı</label>
                <input type="text" id="new-username" placeholder="Kullanıcı adı girin" />
            </div>
            <div class="input-group">
                <label>Şifre</label>
                <input type="password" id="new-password" placeholder="Şifre girin" />
            </div>
            <div class="input-group">
                <label>Rol</label>
                <select id="new-role">
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <button class="login-btn" onclick="addUser()">
                <i class="bi bi-plus-circle"></i> Ekle
            </button>
            <p id="add-message"></p>
        </div>

        <!-- Kullanıcı Listesi -->
        <div class="admin-card">
            <h2><i class="bi bi-people-fill"></i> Kullanıcılar</h2>
            <div id="user-list"></div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
